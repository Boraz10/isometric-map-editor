name: Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false   # let the other platforms finish if one fails
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux_x64
          - os: windows-latest
            platform: win_x64
          - os: macos-latest
            platform: macos_universal
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # needed to attach the packages to a GitHub release

    env:
      PROJECT_NAME: IsometricMapEditor
      VERSION: ${{ github.event.release.tag_name || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxext-dev libxfixes-dev libwayland-dev libxkbcommon-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: bash
        run: |
          BIN_DIR="build/${PROJECT_NAME}"
          EXE="${PROJECT_NAME}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN_DIR="${BIN_DIR}/Release"
            EXE="${EXE}.exe"
          fi

          PACKAGE="${PROJECT_NAME}_${VERSION}_${{ matrix.platform }}"
          mkdir -p "dist/${PROJECT_NAME}"
          cp "${BIN_DIR}/${EXE}" README.md LICENSE "dist/${PROJECT_NAME}/"
          cp -R "${BIN_DIR}/resources" "dist/${PROJECT_NAME}/"

          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../${PACKAGE}.zip" "${PROJECT_NAME}"
          else
            tar -czf "../${PACKAGE}.tar.gz" "${PROJECT_NAME}"
          fi
          echo "PACKAGE=${PACKAGE}" >> "$GITHUB_ENV"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.*

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.PACKAGE }}.*
